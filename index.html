<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WEB PAGE TITLE</title>
  <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64,BASE64_FAVICON" />
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:        #080b14;
      --surface:   #0d1120;
      --card:      #111827;
      --border:    rgba(255,255,255,0.07);
      --accent:    #3b82f6;
      --accent2:   #06b6d4;
      --accent3:   #8b5cf6;
      --glow:      rgba(59,130,246,0.35);
      --text:      #f1f5f9;
      --muted:     #64748b;
      --success:   #10b981;
      --radius:    16px;
      --radius-sm: 10px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    /* ── Animated background ── */
    .bg-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 50px 50px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 20%, transparent 100%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .orb-1 {
      width: 600px; height: 600px;
      background: radial-gradient(circle, #1d4ed8 0%, transparent 70%);
      top: -150px; left: -150px;
      animation-delay: 0s;
    }
    .orb-2 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #7c3aed 0%, transparent 70%);
      bottom: -100px; right: -100px;
      animation-delay: -6s;
    }
    .orb-3 {
      width: 350px; height: 350px;
      background: radial-gradient(circle, #0e7490 0%, transparent 70%);
      top: 40%; left: 55%;
      animation-delay: -12s;
    }

    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      33%  { transform: translate(40px, -30px) scale(1.05); }
      66%  { transform: translate(-20px, 50px) scale(0.95); }
      100% { transform: translate(30px, -20px) scale(1.02); }
    }

    /* Particles */
    .particles {
      position: absolute;
      inset: 0;
    }
    .particle {
      position: absolute;
      width: 2px; height: 2px;
      background: rgba(255,255,255,0.4);
      border-radius: 50%;
      animation: float-up linear infinite;
    }
    @keyframes float-up {
      0%   { transform: translateY(0) translateX(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.5; }
      100% { transform: translateY(-100vh) translateX(30px); opacity: 0; }
    }

    /* Scan line */
    .scanline {
      position: absolute;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(59,130,246,0.3), transparent);
      animation: scan 8s linear infinite;
    }
    @keyframes scan {
      0%   { top: -2px; }
      100% { top: 100%; }
    }

    /* ── Layout ── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
      background: rgba(8,11,20,0.6);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-img {
      height: 36px;
      width: auto;
      object-fit: contain;
    }

    .logo-divider {
      width: 1px;
      height: 24px;
      background: var(--border);
    }

    .logo-title {
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.01em;
    }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04),
        0 32px 80px rgba(0,0,0,0.6),
        0 0 80px rgba(59,130,246,0.04);
      animation: card-in 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Banner */
    .banner-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 7;
      overflow: hidden;
      background: #0a0f1e;
    }

    .banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease;
    }

    .banner-wrap:hover .banner-img {
      transform: scale(1.03);
    }

    .banner-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        transparent 40%,
        rgba(17,24,39,0.9) 100%
      );
    }

    .banner-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 500;
      color: var(--accent2);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* Card body */
    .card-body {
      padding: 32px;
    }

    .card-header {
      margin-bottom: 28px;
    }

    .card-title {
      font-family: 'Syne', sans-serif;
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .card-subtitle {
      margin-top: 8px;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* Steps */
    .steps {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .step {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .step-num {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      font-family: 'Syne', sans-serif;
      transition: all 0.3s ease;
    }

    .step-num.pending {
      background: rgba(255,255,255,0.06);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .step-num.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      box-shadow: 0 0 16px var(--glow);
    }

    .step-num.done {
      background: var(--success);
      color: #fff;
    }

    .step-num.done::before {
      content: '✓';
    }

    .step-content {
      padding-top: 3px;
    }

    .step-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }

    .step-label.muted { color: var(--muted); }

    .step-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 24px 0;
    }

    /* Turnstile */
    .turnstile-wrap {
      display: flex;
      justify-content: center;
      margin: 24px 0;
      min-height: 65px;
      align-items: center;
    }

    /* Status message */
    .status-msg {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
    }

    .status-msg.success {
      display: flex;
      background: rgba(16,185,129,0.1);
      border: 1px solid rgba(16,185,129,0.25);
      color: #34d399;
    }

    .status-msg.error {
      display: flex;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.25);
      color: #f87171;
    }

    .status-icon {
      font-size: 16px;
      flex-shrink: 0;
    }

    /* Download button */
    .btn-download {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px 24px;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.01em;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .btn-download.locked {
      background: rgba(255,255,255,0.04);
      color: var(--muted);
      cursor: not-allowed;
      border: 1px solid var(--border);
    }

    .btn-download.unlocked {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent3) 100%);
      color: #fff;
      box-shadow:
        0 0 30px rgba(59,130,246,0.3),
        0 8px 24px rgba(0,0,0,0.4);
    }

    .btn-download.unlocked::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .btn-download.unlocked:hover {
      transform: translateY(-2px);
      box-shadow:
        0 0 50px rgba(59,130,246,0.45),
        0 16px 40px rgba(0,0,0,0.4);
    }

    .btn-download.unlocked:hover::before {
      opacity: 1;
    }

    .btn-download.unlocked:active {
      transform: translateY(0);
    }

    .btn-download.loading {
      pointer-events: none;
      opacity: 0.8;
    }

    /* Shimmer on locked button */
    .btn-download.locked .lock-icon {
      animation: pulse-lock 2s ease-in-out infinite;
    }

    @keyframes pulse-lock {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50%       { opacity: 0.7; transform: scale(1.1); }
    }

    /* Spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Download glow pulse on unlock */
    @keyframes unlock-pulse {
      0%   { box-shadow: 0 0 30px rgba(59,130,246,0.3), 0 8px 24px rgba(0,0,0,0.4); }
      50%  { box-shadow: 0 0 60px rgba(59,130,246,0.6), 0 8px 32px rgba(0,0,0,0.5); }
      100% { box-shadow: 0 0 30px rgba(59,130,246,0.3), 0 8px 24px rgba(0,0,0,0.4); }
    }

    .btn-download.just-unlocked {
      animation: unlock-pulse 1.5s ease-in-out 3;
    }

    /* Progress bar (download) */
    .progress-wrap {
      display: none;
      height: 3px;
      background: rgba(255,255,255,0.06);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 12px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 999px;
      width: 0%;
      transition: width 0.4s ease;
    }

    /* Footer */
    footer {
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .powered-by {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .powered-by-logo {
      height: 20px;
      width: auto;
      object-fit: contain;
      vertical-align: middle;
    }

    /* Responsive */
    @media (max-width: 600px) {
      header { padding: 16px 20px; }
      .card-body { padding: 24px 20px; }
      .card-title { font-size: 22px; }
    }
  </style>
</head>
<body>

<!-- Animated background -->
<div class="bg-scene">
  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="particles" id="particles"></div>
  <div class="scanline"></div>
</div>

<div class="page">

  <!-- Header -->
  <header>
    <div class="logo-wrap">
      <img class="logo-img" src="data:image/png;base64,BASE64_LOGO" alt="Logo" />
      <div class="logo-divider"></div>
      <span class="logo-title">TITLE</span>
    </div>
  </header>

  <!-- Main -->
  <main>
    <div class="card">

      <!-- Banner preview -->
      <div class="banner-wrap">
        <img class="banner-img" src="data:image/png;base64,BASE64_BANNER" alt="Preview" />
        <div class="banner-overlay"></div>
        <div class="banner-badge">Preview</div>
      </div>

      <!-- Body -->
      <div class="card-body">

        <div class="card-header">
          <h1 class="card-title">TITLE</h1>
          <p class="card-subtitle">Complete the security check below to unlock your download. This helps us ensure you're a real human.</p>
        </div>

        <!-- Steps -->
        <div class="steps">
          <div class="step">
            <div class="step-num active" id="step1-num">1</div>
            <div class="step-content">
              <div class="step-label" id="step1-label">Verify you're human</div>
              <div class="step-desc">Complete the Cloudflare Turnstile challenge below.</div>
            </div>
          </div>
          <div class="step">
            <div class="step-num pending" id="step2-num">2</div>
            <div class="step-content">
              <div class="step-label muted" id="step2-label">Download unlocked</div>
              <div class="step-desc">Click the button to start your download.</div>
            </div>
          </div>
        </div>

        <div class="divider"></div>

        <!-- Turnstile -->
        <div class="turnstile-wrap">
          <div
            class="cf-turnstile"
            data-sitekey="TURNSTILE_SITE_KEY"
            data-theme="dark"
            data-callback="onTurnstileSuccess"
            data-error-callback="onTurnstileError"
            data-expired-callback="onTurnstileExpired"
          ></div>
        </div>

        <!-- Status message -->
        <div class="status-msg" id="statusMsg">
          <span class="status-icon" id="statusIcon"></span>
          <span id="statusText"></span>
        </div>

        <!-- Download button -->
        <button
          class="btn-download locked"
          id="downloadBtn"
          disabled
          onclick="startDownload()"
        >
          <span class="lock-icon" id="btnIcon">🔒</span>
          <span id="btnText">Complete verification to unlock</span>
          <div class="spinner" id="btnSpinner"></div>
        </button>

        <!-- Progress -->
        <div class="progress-wrap" id="progressWrap">
          <div class="progress-bar" id="progressBar"></div>
        </div>

      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="powered-by">
      <span>Powered by</span>
      <img class="powered-by-logo" src="data:image/png;base64,BASE64_POWERED_BY" alt="Powered by logo" />
    </div>
  </footer>

</div>

<script>
  /* ── Particles ── */
  (function () {
    const container = document.getElementById('particles');
    const count = 40;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.cssText = `
        left: ${Math.random() * 100}%;
        bottom: ${-10 + Math.random() * 20}px;
        width: ${1 + Math.random() * 2}px;
        height: ${1 + Math.random() * 2}px;
        animation-duration: ${8 + Math.random() * 16}s;
        animation-delay: ${-Math.random() * 20}s;
        opacity: ${0.2 + Math.random() * 0.5};
      `;
      container.appendChild(p);
    }
  })();

  /* ── Turnstile state ── */
  let turnstileToken = null;
  let isDownloading   = false;

  function onTurnstileSuccess(token) {
    turnstileToken = token;
    setStep1Done();
    unlockButton();
  }

  function onTurnstileError() {
    showStatus('error', '⚠️', 'Verification failed. Please try again.');
    lockButton();
  }

  function onTurnstileExpired() {
    turnstileToken = null;
    showStatus('error', '⏱', 'Verification expired. Please complete it again.');
    lockButton();
  }

  function setStep1Done() {
    const num   = document.getElementById('step1-num');
    const label = document.getElementById('step1-label');
    num.className   = 'step-num done';
    num.textContent = '';
    label.textContent = 'Verified ✓';
    label.classList.remove('muted');

    const num2   = document.getElementById('step2-num');
    const label2 = document.getElementById('step2-label');
    num2.className   = 'step-num active';
    label2.classList.remove('muted');
  }

  function unlockButton() {
    const btn = document.getElementById('downloadBtn');
    btn.disabled = false;
    btn.className = 'btn-download unlocked just-unlocked';
    document.getElementById('btnIcon').textContent = '⬇';
    document.getElementById('btnText').textContent = 'Download Now';
    showStatus('success', '✅', 'Verification successful! Your download is ready.');

    // Remove pulse class after animation
    setTimeout(() => btn.classList.remove('just-unlocked'), 4600);
  }

  function lockButton() {
    const btn = document.getElementById('downloadBtn');
    btn.disabled = true;
    btn.className = 'btn-download locked';
    document.getElementById('btnIcon').textContent = '🔒';
    document.getElementById('btnText').textContent = 'Complete verification to unlock';
    turnstileToken = null;
  }

  function showStatus(type, icon, text) {
    const el   = document.getElementById('statusMsg');
    const ico  = document.getElementById('statusIcon');
    const txt  = document.getElementById('statusText');
    el.className  = 'status-msg ' + type;
    ico.textContent = icon;
    txt.textContent = text;
  }

  /* ── Download ── */
  async function startDownload() {
    if (!turnstileToken || isDownloading) return;
    isDownloading = true;

    const btn     = document.getElementById('downloadBtn');
    const spinner = document.getElementById('btnSpinner');
    const btnTxt  = document.getElementById('btnText');
    const btnIco  = document.getElementById('btnIcon');

    btn.classList.add('loading');
    spinner.style.display = 'block';
    btnIco.style.display  = 'none';
    btnTxt.textContent    = 'Preparing download…';

    // Show progress bar
    const progressWrap = document.getElementById('progressWrap');
    const progressBar  = document.getElementById('progressBar');
    progressWrap.style.display = 'block';
    let prog = 0;
    const progInterval = setInterval(() => {
      prog = Math.min(prog + Math.random() * 15, 90);
      progressBar.style.width = prog + '%';
    }, 200);

    try {
      const resp = await fetch('/api/download', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: turnstileToken }),
      });

      clearInterval(progInterval);
      progressBar.style.width = '100%';

      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.message || 'Download request failed.');
      }

      // Stream the response body into a blob, then trigger browser download
      const blob = await resp.blob();
      const disposition = resp.headers.get('Content-Disposition') || '';
      const filenameMatch = disposition.match(/filename="?([^"]+)"?/);
      const filename = filenameMatch ? filenameMatch[1] : 'download';

      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);

      showStatus('success', '⬇️', 'Download started successfully!');

      // Mark step 2 done
      const num2   = document.getElementById('step2-num');
      num2.className   = 'step-num done';
      num2.textContent = '';

    } catch (e) {
      clearInterval(progInterval);
      showStatus('error', '❌', e.message || 'Something went wrong. Please try again.');
      // Reset turnstile
      if (window.turnstile) window.turnstile.reset();
      lockButton();
    } finally {
      setTimeout(() => {
        progressWrap.style.display = 'none';
        progressBar.style.width = '0%';
      }, 800);

      spinner.style.display = 'none';
      btnIco.style.display  = '';
      btnTxt.textContent    = 'Download Now';
      btn.classList.remove('loading');
      isDownloading = false;
    }
  }
</script>
</body>
</html>
